<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADA Hall - Tickets</title>
  <link rel="stylesheet" href="css/style.css">
  <script defer src="js/venue-data.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <header class="event-banner">
    <div class="container banner-inner">
      <p class="date-badge">
        <span class="date-day">08</span>
        <span class="date-month">Nov</span>
      </p>
      <div>
        <p class="event-place">ADA University, C building</p>
        <h1>ADA Hall</h1>
        <p class="event-time">Evening play, Sunday at 21:00</p>
      </div>
    </div>
  </header>

  <main class="container layout">
    <section class="map-area" aria-labelledby="map-heading">
      <div class="map-header">
        <h2 id="map-heading">Choose your seats</h2>
        <p class="hint">Click a seat to see its price</p>
      </div>

      <div class="legends">
        <ul class="legend" id="legend"></ul>
        <ul class="legend">
          <li><span class="swatch swatch--inspected"></span>Selected</li>
          <li><span class="swatch swatch--in-cart"></span>In your cart</li>
          <li><span class="swatch swatch--unavailable"></span>Unavailable</li>
        </ul>
      </div>

      <div class="map-frame">
        <div class="map-viewport" id="map-viewport">
          <div class="venue-map" id="venue-map">
            <div class="floor-row">
              <div class="balcony-side" id="balcony-left"></div>
              <div class="floor" id="floor">
                <div class="stage">STAGE</div>
              </div>
              <div class="balcony-side" id="balcony-right"></div>
            </div>
          </div>
        </div>

        <div class="map-controls">
          <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
          <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
          <button type="button" id="move-up" aria-label="Move up">↑</button>
          <button type="button" id="move-down" aria-label="Move down">↓</button>
          <button type="button" id="move-left" aria-label="Move left">←</button>
          <button type="button" id="move-right" aria-label="Move right">→</button>
          <button type="button" id="reset-view" aria-label="Reset view" title="Reset view">↺</button>
        </div>
      </div>
    </section>

    <section class="panel tickets" id="cart">
      <h2>Your tickets</h2>
      <p class="hint">No tickets yet. Pick a seat on the map.</p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Project | Said Mehraliyev | 2026</p>
    </div>
  </footer>
</body>
</html>
